<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a0e" />
      <stop offset="75%" stop-color="#180f07" />
      <stop offset="100%" stop-color="#0a0603" />
    </radialGradient>
    <linearGradient id="goldStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0cc" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6327" />
    </linearGradient>
    <linearGradient id="rosePetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="35%" stop-color="#fb7185" />
      <stop offset="75%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="goldPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="50%" stop-color="#e2bf65" />
      <stop offset="100%" stop-color="#a3792b" />
    </linearGradient>
    <linearGradient id="emeraldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="60%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="url(#goldStem)" stroke-width="2.5" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#goldStem)" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7" />

  <!-- Botanical Leaves -->
  <path d="M16 44C10 38 12 28 20 26C22 32 20 40 16 44Z" fill="url(#emeraldLeaf)" stroke="#d4af37" stroke-width="0.8" />
  <path d="M48 44C54 38 52 28 44 26C42 32 44 40 48 44Z" fill="url(#emeraldLeaf)" stroke="#d4af37" stroke-width="0.8" />
  <path d="M22 50C16 48 16 38 24 38C26 42 26 48 22 50Z" fill="url(#emeraldLeaf)" opacity="0.85" />
  <path d="M42 50C48 48 48 38 40 38C38 42 38 48 42 50Z" fill="url(#emeraldLeaf)" opacity="0.85" />

  <!-- Blooming Wedding Rose Petals (Tier 1 - Outer Gold) -->
  <circle cx="32" cy="20" r="9" fill="url(#goldPetal)" opacity="0.95" />
  <circle cx="32" cy="44" r="9" fill="url(#goldPetal)" opacity="0.95" />
  <circle cx="20" cy="32" r="9" fill="url(#goldPetal)" opacity="0.95" />
  <circle cx="44" cy="32" r="9" fill="url(#goldPetal)" opacity="0.95" />

  <!-- Diagonal Petals (Tier 2 - Rose Silk) -->
  <circle cx="23" cy="23" r="8" fill="url(#rosePetal)" />
  <circle cx="41" cy="23" r="8" fill="url(#rosePetal)" />
  <circle cx="23" cy="41" r="8" fill="url(#rosePetal)" />
  <circle cx="41" cy="41" r="8" fill="url(#rosePetal)" />

  <!-- Rose Blossom Center -->
  <circle cx="32" cy="32" r="10" fill="url(#rosePetal)" stroke="#ffd700" stroke-width="1.2" />
  <path d="M30 26C34 26 38 29 36 34C34 39 28 37 28 32C28 29 30 26 30 26Z" fill="#fda4af" opacity="0.8" />
  
  <!-- Golden Center Pistil / Sparkle -->
  <circle cx="32" cy="32" r="4" fill="url(#goldStem)" />
  <circle cx="32" cy="32" r="1.5" fill="#ffffff" />
</svg>
